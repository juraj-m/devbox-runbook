# The box's settings: the one file to edit before the first bootstrap.
# Shell syntax. bootstrap.sh reads it, installs it as /etc/devbox/devbox.conf
# (where devbox-maintenance and devbox-egress read it) and fills the systemd
# units' @PLACEHOLDERS@ from it. The Makefile reads DEV_USER and TS_HOSTNAME.

# The one login on the box: you, and every agent you start.
DEV_USER=dev
# Make it the same path as your home on the laptop (/Users/you on a Mac):
# Claude Code keys each project's memory by its absolute path
# (~/.claude/projects/-Users-you---myproject), so the same path on both
# machines means the same memory. /home/$DEV_USER works too, without that.
DEV_HOME=/home/dev
# Where your projects live, on the laptop and the box alike. ws's WS_ROOT.
PROJECTS_DIR=$DEV_HOME/_
# Your copy of this repo, cloned on the box (ws, the control page, AGENTS.md).
DEVBOX_DIR=$PROJECTS_DIR/dev-server
DEVBOX_REPO=git@github.com:YOUR-USER/dev-server.git

# The box's name on the tailnet (MagicDNS): ssh dev@devbox,
# https://devbox.<tailnet>.ts.net:<port>.
TS_HOSTNAME=devbox
# Your time zone (timedatectl list-timezones), e.g. America/New_York, so the
# box's clock and the maintenance window below are in your local time.
TZ_NAME=Etc/UTC
# When weekly maintenance becomes due (systemd OnCalendar, in TZ_NAME's zone).
# It then waits for idle time (devbox-maintenance).
MAINTENANCE_DUE="Sun *-*-* 04:00:00"

# git identity for commits made on the box.
GIT_NAME="Your Name"
GIT_EMAIL=you@example.com
# GitHub: the owner a gh command means when it names none, and the repos the
# box may read but never push to (see docs/ARCHITECTURE.md, "GitHub access").
GITHUB_DEFAULT_OWNER=YOUR-USER
GITHUB_PROTECTED="YOUR-USER/secrets"

# Swap: where a paused stack's memory goes. Size it for the stacks you'd
# have paused at once (a big web stack is ~10 GB paused) plus room.
SWAP_SIZE=64G
# The outbound allowlist's mode on a new box: audit (log only), enforce, off.
# A running box keeps the mode it was last switched to.
EGRESS_MODE=audit
